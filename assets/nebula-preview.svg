<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080b" />
      <stop offset="50%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <!-- Ambient Aura -->
    <radialGradient id="ambient-aura" cx="50%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#07080b" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Panel Fill -->
    <linearGradient id="glass-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Album Art Placeholder Gradient -->
    <linearGradient id="album-art-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="album-art-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="680" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="680" fill="url(#ambient-aura)" rx="16" />

  <!-- Outer Window Border -->
  <rect width="1198" height="678" x="1" y="1" fill="none" stroke="#ffffff" stroke-opacity="0.1" rx="15" />

  <!-- Window Header / Titlebar -->
  <g id="window-header">
    <circle cx="28" cy="24" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="44" cy="24" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="60" cy="24" r="5" fill="#10b981" opacity="0.8" />
    <text x="600" y="28" fill="#959aa8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" font-weight="600" text-anchor="middle">Nebula Music — Universal Desktop Player</text>
  </g>

  <!-- ==================== SIDEBAR ==================== -->
  <g id="sidebar" transform="translate(0, 48)">
    <rect width="220" height="552" fill="#0d1016" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.06" />

    <!-- Brand -->
    <g transform="translate(20, 16)">
      <circle cx="10" cy="10" r="7" fill="#10b981" filter="url(#glow)" />
      <text x="26" y="15" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="16" font-weight="800">Nebula</text>
      <rect x="90" y="4" width="68" height="15" rx="4" fill="#ffffff" fill-opacity="0.08" />
      <text x="124" y="14" fill="#10b981" font-family="Segoe UI, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">UNIVERSAL</text>
    </g>

    <!-- Multi-Service Switcher Pills -->
    <g transform="translate(14, 46)">
      <rect width="192" height="32" rx="7" fill="#000000" fill-opacity="0.4" stroke="#ffffff" stroke-opacity="0.08" />
      <!-- YTM Active -->
      <rect x="3" y="3" width="60" height="26" rx="5" fill="#ffffff" fill-opacity="0.12" />
      <circle cx="15" cy="16" r="4" fill="#ef4444" />
      <text x="40" y="19.5" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">YTM</text>
      <!-- Spotify -->
      <circle cx="78" cy="16" r="4" fill="#1ed760" />
      <text x="103" y="19.5" fill="#959aa8" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Spotify</text>
      <!-- SoundCloud -->
      <circle cx="140" cy="16" r="4" fill="#ff5500" />
      <text x="168" y="19.5" fill="#959aa8" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">SoundCloud</text>
    </g>

    <!-- Navigation Items -->
    <g transform="translate(14, 94)">
      <!-- Home (Active) -->
      <rect width="192" height="34" rx="7" fill="#1e2330" />
      <rect width="3" height="18" x="0" y="8" rx="1.5" fill="#10b981" />
      <text x="36" y="22" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Home</text>

      <!-- Library -->
      <g transform="translate(0, 38)">
        <text x="36" y="22" fill="#959aa8" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600">Library</text>
      </g>

      <!-- Liked Music -->
      <g transform="translate(0, 76)">
        <text x="36" y="22" fill="#959aa8" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600">Liked Music</text>
      </g>
    </g>

    <!-- Playlists Section -->
    <g transform="translate(20, 240)">
      <text x="0" y="0" fill="#5a5f70" font-family="Segoe UI, sans-serif" font-size="10" font-weight="800" letter-spacing="1">PLAYLISTS</text>
      <text x="0" y="24" fill="#959aa8" font-family="Segoe UI, sans-serif" font-size="12">Night Drive 2026</text>
      <text x="0" y="48" fill="#959aa8" font-family="Segoe UI, sans-serif" font-size="12">Cyberpunk Synthwave</text>
      <text x="0" y="72" fill="#959aa8" font-family="Segoe UI, sans-serif" font-size="12">Chill Acoustic Beats</text>
      <text x="0" y="96" fill="#959aa8" font-family="Segoe UI, sans-serif" font-size="12">Deep Focus Flow</text>
    </g>

    <!-- AdBlocker Widget -->
    <g transform="translate(14, 430)">
      <rect width="192" height="48" rx="10" fill="#191e2a" stroke="#10b981" stroke-opacity="0.3" />
      <circle cx="28" cy="24" r="12" fill="#10b981" fill-opacity="0.15" />
      <text x="28" y="28" fill="#10b981" font-family="Segoe UI, sans-serif" font-size="13" text-anchor="middle">🛡️</text>
      <text x="50" y="20" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">Ad Blocker</text>
      <text x="50" y="34" fill="#10b981" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="600">Active • 142 blocked</text>
      <rect x="154" y="16" width="28" height="16" rx="4" fill="#10b981" fill-opacity="0.25" />
      <text x="168" y="28" fill="#10b981" font-family="Segoe UI, sans-serif" font-size="9" font-weight="800" text-anchor="middle">ON</text>
    </g>

    <!-- User Profile Footer -->
    <g transform="translate(14, 492)">
      <rect width="192" height="46" rx="8" fill="#151922" stroke="#ffffff" stroke-opacity="0.06" />
      <circle cx="24" cy="23" r="14" fill="#10b981" />
      <text x="24" y="27" fill="#022c19" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800" text-anchor="middle">D</text>
      <text x="46" y="20" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">Dorp</text>
      <text x="46" y="33" fill="#10b981" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600">Google Connected</text>
    </g>
  </g>

  <!-- ==================== CENTER CONTENT ==================== -->
  <g id="center" transform="translate(240, 48)">
    <!-- TopBar -->
    <g id="topbar" transform="translate(0, 10)">
      <!-- Search Input -->
      <rect x="0" y="0" width="440" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
      <text x="20" y="24" fill="#959aa8" font-family="Segoe UI, sans-serif" font-size="13">🔍  Search songs, albums, artists...</text>
      <rect x="384" y="9" width="44" height="20" rx="5" fill="#ffffff" fill-opacity="0.08" />
      <text x="406" y="23" fill="#959aa8" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Ctrl K</text>

      <!-- Theme Accent Swatches -->
      <g transform="translate(470, 8)">
        <circle cx="10" cy="11" r="9" fill="#10b981" stroke="#ffffff" stroke-width="2" />
        <circle cx="34" cy="11" r="7" fill="#c8f560" />
        <circle cx="56" cy="11" r="7" fill="#a855f7" />
        <circle cx="78" cy="11" r="7" fill="#06b6d4" />
        <circle cx="100" cy="11" r="7" fill="#f43f5e" />
      </g>
    </g>

    <!-- Page Header & Greeting -->
    <g transform="translate(0, 72)">
      <text x="0" y="30" fill="#ffffff" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="28" font-weight="800">Good evening, Dorp</text>

      <!-- Mood Chips -->
      <g transform="translate(0, 48)">
        <rect x="0" y="0" width="70" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
        <text x="35" y="18" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Relax</text>

        <rect x="78" y="0" width="84" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
        <text x="120" y="18" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Workout</text>

        <rect x="170" y="0" width="70" height="28" rx="14" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4" />
        <text x="205" y="18" fill="#10b981" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Focus</text>

        <rect x="248" y="0" width="84" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
        <text x="290" y="18" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Energize</text>

        <rect x="340" y="0" width="74" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
        <text x="377" y="18" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Party</text>
      </g>
    </g>

    <!-- Music Cards Row -->
    <g transform="translate(0, 170)">
      <text x="0" y="20" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="18" font-weight="750">Featured &amp; Recommended</text>

      <!-- Card 1 -->
      <g transform="translate(0, 36)">
        <rect width="180" height="230" rx="12" fill="#151922" stroke="#ffffff" stroke-opacity="0.06" filter="url(#card-shadow)" />
        <rect x="12" y="12" width="156" height="140" rx="8" fill="url(#album-art-1)" />
        <!-- Floating Play Button -->
        <circle cx="144" cy="132" r="18" fill="#10b981" filter="url(#glow)" />
        <polygon points="141,126 150,132 141,138" fill="#022c19" />
        <text x="14" y="174" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="700">Cosmic Odyssey</text>
        <text x="14" y="192" fill="#959aa8" font-family="Segoe UI, sans-serif" font-size="11.5">Aura Soundscapes</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(196, 36)">
        <rect width="180" height="230" rx="12" fill="#151922" stroke="#ffffff" stroke-opacity="0.06" filter="url(#card-shadow)" />
        <rect x="12" y="12" width="156" height="140" rx="8" fill="url(#album-art-2)" />
        <text x="14" y="174" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="700">Deep Waves EP</text>
        <text x="14" y="192" fill="#959aa8" font-family="Segoe UI, sans-serif" font-size="11.5">Nebula Collective</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(392, 36)">
        <rect width="180" height="230" rx="12" fill="#151922" stroke="#ffffff" stroke-opacity="0.06" filter="url(#card-shadow)" />
        <rect x="12" y="12" width="156" height="140" rx="8" fill="linear-gradient(135deg, #f59e0b, #ef4444)" />
        <text x="14" y="174" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="700">Solar Flare</text>
        <text x="14" y="192" fill="#959aa8" font-family="Segoe UI, sans-serif" font-size="11.5">Hyper Light</text>
      </g>
    </g>
  </g>

  <!-- ==================== NOW PLAYING SIDEBAR ==================== -->
  <g id="now-playing" transform="translate(870, 48)">
    <rect width="330" height="552" fill="#0d1016" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.06" />

    <!-- Big Artwork -->
    <g transform="translate(25, 20)">
      <rect width="280" height="240" rx="14" fill="url(#album-art-1)" filter="url(#card-shadow)" />
      <!-- Ambient Backglow -->
      <rect width="280" height="240" rx="14" fill="#ec4899" fill-opacity="0.15" filter="url(#glow)" />
    </g>

    <!-- Track Meta -->
    <g transform="translate(25, 280)">
      <text x="0" y="18" fill="#ffffff" font-family="Segoe UI Variable Display, Segoe UI, sans-serif" font-size="17" font-weight="750">Cosmic Odyssey</text>
      <text x="0" y="36" fill="#959aa8" font-family="Segoe UI, sans-serif" font-size="13">Aura Soundscapes • Nebula Music</text>
    </g>

    <!-- Up Next Queue -->
    <g transform="translate(25, 335)">
      <text x="0" y="0" fill="#5a5f70" font-family="Segoe UI, sans-serif" font-size="11" font-weight="800">UP NEXT</text>

      <g transform="translate(0, 16)">
        <rect width="280" height="42" rx="6" fill="#ffffff" fill-opacity="0.04" />
        <rect x="6" y="6" width="30" height="30" rx="4" fill="url(#album-art-2)" />
        <text x="44" y="20" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="650">Solar Flare</text>
        <text x="44" y="32" fill="#959aa8" font-family="Segoe UI, sans-serif" font-size="10.5">Hyper Light</text>
        <text x="265" y="26" fill="#5a5f70" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="end">3:42</text>
      </g>

      <g transform="translate(0, 66)">
        <rect width="280" height="42" rx="6" fill="#ffffff" fill-opacity="0.02" />
        <rect x="6" y="6" width="30" height="30" rx="4" fill="#3b82f6" />
        <text x="44" y="20" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="650">Neon Sky</text>
        <text x="44" y="32" fill="#959aa8" font-family="Segoe UI, sans-serif" font-size="10.5">Retro Synth</text>
        <text x="265" y="26" fill="#5a5f70" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="end">4:15</text>
      </g>
    </g>
  </g>

  <!-- ==================== PLAYER BAR (BOTTOM DOCK) ==================== -->
  <g id="playerbar" transform="translate(0, 600)">
    <rect width="1200" height="80" fill="#0b0e14" fill-opacity="0.95" stroke="#ffffff" stroke-opacity="0.08" />

    <!-- Left: Track info -->
    <g transform="translate(24, 15)">
      <rect width="50" height="50" rx="8" fill="url(#album-art-1)" />
      <text x="64" y="24" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="700">Cosmic Odyssey</text>
      <text x="64" y="40" fill="#959aa8" font-family="Segoe UI, sans-serif" font-size="12">Aura Soundscapes</text>
      <text x="195" y="28" fill="#f43f5e" font-size="16">♥</text>
      <!-- Ad-Free Shield Badge -->
      <rect x="220" y="16" width="62" height="18" rx="9" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3" />
      <text x="251" y="29" fill="#10b981" font-family="Segoe UI, sans-serif" font-size="9" font-weight="800" text-anchor="middle">🛡️ Ad-Free</text>
    </g>

    <!-- Center: Playback Controls & Scrubber -->
    <g transform="translate(450, 14)">
      <!-- Buttons -->
      <g transform="translate(110, 0)">
        <text x="0" y="18" fill="#959aa8" font-size="13">🔀</text>
        <text x="35" y="18" fill="#ffffff" font-size="14">⏮</text>
        <!-- Big Play Button -->
        <circle cx="78" cy="13" r="18" fill="#ffffff" filter="url(#glow)" />
        <polygon points="76,8 84,13 76,18" fill="#07080b" />
        <text x="110" y="18" fill="#ffffff" font-size="14">⏭</text>
        <text x="145" y="18" fill="#959aa8" font-size="13">🔁</text>
      </g>

      <!-- Seek Bar -->
      <g transform="translate(0, 36)">
        <text x="0" y="10" fill="#959aa8" font-family="Segoe UI, sans-serif" font-size="11">1:48</text>
        <!-- Track -->
        <rect x="36" y="5" width="300" height="4" rx="2" fill="#ffffff" fill-opacity="0.15" />
        <!-- Filled Track -->
        <rect x="36" y="5" width="130" height="4" rx="2" fill="#10b981" />
        <!-- Scrubber Dot -->
        <circle cx="166" cy="7" r="5" fill="#ffffff" />
        <text x="372" y="10" fill="#959aa8" font-family="Segoe UI, sans-serif" font-size="11">3:42</text>
      </g>
    </g>

    <!-- Right: Volume & Options -->
    <g transform="translate(980, 26)">
      <text x="0" y="14" fill="#959aa8" font-size="15">🔊</text>
      <rect x="24" y="11" width="100" height="4" rx="2" fill="#ffffff" fill-opacity="0.15" />
      <rect x="24" y="11" width="70" height="4" rx="2" fill="#10b981" />
      <circle cx="94" cy="13" r="4" fill="#ffffff" />
    </g>
  </g>
</svg>
